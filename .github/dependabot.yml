version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # eslint-config-next 16 está hecho para ESLint 9: la 10 rompe el lint (PR #4).
      # Quitar esta regla cuando eslint-config-next soporte ESLint 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
    groups:
      # Parches y menores juntos; las mayores llegan solas para revisarlas con calma.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
