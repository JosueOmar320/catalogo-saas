version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Sólo versiones con 2 semanas publicadas: si una sale con un error o comprometida, hay tiempo de que se sepa.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    ignore:
      # Versiones mayores que hoy rompen el CI; se revisan a mano cuando el ecosistema las soporte.
      # eslint-config-next 16 está hecho para ESLint 9 (la 10 rompe el lint: PR #4).
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # TypeScript 7 (compilador nativo) aún no es compatible con este proyecto (PR #7).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Los tipos de Node siguen la versión del runtime (.nvmrc: 24), no la última publicada (PR #9).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Parches y menores juntos; las mayores llegan solas para revisarlas con calma.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
